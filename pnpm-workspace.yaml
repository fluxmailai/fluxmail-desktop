packages: []

blockExoticSubdeps: false
nodeLinker: hoisted
strictPeerDependencies: false

overrides:
  better-sqlite3: 12.11.1

allowBuilds:
  better-sqlite3: true
  electron: true
  esbuild: true
  fs-xattr: true
  macos-alias: true

minimumReleaseAgeExclude:
