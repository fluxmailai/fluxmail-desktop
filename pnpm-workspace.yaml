packages: []

blockExoticSubdeps: false
nodeLinker: hoisted
strictPeerDependencies: false

overrides:
  better-sqlite3: 12.11.1

allowBuilds:
  better-sqlite3: true
  electron: true
  esbuild: true
  fs-xattr: true
  macos-alias: true

# Keep Renovate's minimumReleaseAge at least this long. To ship an urgent fix
# sooner, add the exact version to minimumReleaseAgeExclude.
minimumReleaseAge: 10080
minimumReleaseAgeExclude:
  - '@fluxmail/*'
  - fluxmail
  - nodemailer@10.3.1
  # Renovate security update: electron@43.8.1
  - electron@43.8.1
minimumReleaseAgeExcludePrune: true
trustPolicy: no-downgrade
trustPolicyExclude:
  - semver@5.7.2
  - semver@6.3.1
  - undici-types@6.21.0
