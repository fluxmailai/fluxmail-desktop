name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v5
        with:
          version: 11.28.8
      - uses: actions/setup-node@v6
        with:
          node-version: 22.22.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Validate Google OAuth overrides
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.FLUXMAIL_DESKTOP_GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.FLUXMAIL_DESKTOP_GOOGLE_CLIENT_SECRET }}
        run: |
          if [[ -n "$GOOGLE_CLIENT_ID" && -z "$GOOGLE_CLIENT_SECRET" ]] || [[ -z "$GOOGLE_CLIENT_ID" && -n "$GOOGLE_CLIENT_SECRET" ]]; then
            echo "::error::Set both Fluxmail Google OAuth override secrets or remove both of them."
            exit 1
          fi
          if [[ -z "$GOOGLE_CLIENT_ID" ]]; then
            echo "::notice::Google OAuth overrides are not configured. Using the Fluxmail package defaults."
          fi
      - name: Configure Apple signing
        env:
          CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          API_KEY: ${{ secrets.APPLE_API_KEY_P8_BASE64 }}
          API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          certificate_configured=0
          for value in "$CERTIFICATE" "$CERTIFICATE_PASSWORD" "$SIGNING_IDENTITY"; do
            if [[ -n "$value" ]]; then
              certificate_configured=$((certificate_configured + 1))
            fi
          done
          notarization_configured=0
          for value in "$API_KEY" "$API_KEY_ID" "$API_ISSUER"; do
            if [[ -n "$value" ]]; then
              notarization_configured=$((notarization_configured + 1))
            fi
          done

          if [[ "$certificate_configured" -ne 0 && "$certificate_configured" -ne 3 ]]; then
            echo "::error::Apple signing is only partially configured. Set the certificate, password, and identity together."
            exit 1
          fi
          if [[ "$notarization_configured" -ne 0 && "$notarization_configured" -ne 3 ]]; then
            echo "::error::Apple notarization is only partially configured. Set all three API credentials or remove all of them."
            exit 1
          fi
          if [[ "$certificate_configured" -eq 0 && "$notarization_configured" -ne 0 ]]; then
            echo "::error::Apple notarization requires a signing certificate."
            exit 1
          fi

          if [[ "$certificate_configured" -eq 0 ]]; then
            echo "::notice::Apple credentials are not configured. Building artifacts with an ad hoc signature."
            exit 0
          fi

          CERTIFICATE_PATH="$RUNNER_TEMP/fluxmail.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/fluxmail-signing.keychain-db"
          echo "$CERTIFICATE" | base64 --decode > "$CERTIFICATE_PATH"
          security create-keychain -p "$RUNNER_TEMP" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$RUNNER_TEMP" "$KEYCHAIN_PATH"
          security import "$CERTIFICATE_PATH" -P "$CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$RUNNER_TEMP" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH"
          echo "APPLE_SIGNING_IDENTITY=$SIGNING_IDENTITY" >> "$GITHUB_ENV"
          echo "APPLE_SIGNING_KEYCHAIN=$KEYCHAIN_PATH" >> "$GITHUB_ENV"

          if [[ "$notarization_configured" -eq 0 ]]; then
            echo "::notice::Using the persistent self-signed Fluxmail certificate without notarization."
            exit 0
          fi

          echo "$API_KEY" | base64 --decode > "$RUNNER_TEMP/AuthKey.p8"
          echo "APPLE_API_KEY=$RUNNER_TEMP/AuthKey.p8" >> "$GITHUB_ENV"
          echo "APPLE_API_KEY_ID=$API_KEY_ID" >> "$GITHUB_ENV"
          echo "APPLE_API_ISSUER=$API_ISSUER" >> "$GITHUB_ENV"
      - name: Make release artifacts
        env:
          NODE_OPTIONS: --max-old-space-size=4096
          FLUXMAIL_DESKTOP_GOOGLE_CLIENT_ID: ${{ secrets.FLUXMAIL_DESKTOP_GOOGLE_CLIENT_ID }}
          FLUXMAIL_DESKTOP_GOOGLE_CLIENT_SECRET: ${{ secrets.FLUXMAIL_DESKTOP_GOOGLE_CLIENT_SECRET }}
        run: pnpm exec electron-forge make --arch=${{ matrix.arch }}
      - uses: actions/upload-artifact@v4
        with:
          name: fluxmail-${{ matrix.arch }}
          path: |
            out/make/**/*.dmg
            out/make/**/*.zip
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v4
        with:
          pattern: fluxmail-*
          path: release
          merge-multiple: true
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          APPLE_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY_P8_BASE64 }}
        run: |
          signing_mode=developer-id
          if [[ -z "$APPLE_CERTIFICATE" ]]; then
            signing_mode=ad-hoc
          elif [[ -z "$APPLE_API_KEY" ]]; then
            signing_mode=self-signed
          fi
          node scripts/release-notes.mjs "${GITHUB_REF_NAME}" \
            --signing-mode "$signing_mode" > "$RUNNER_TEMP/release-notes.md"

          node scripts/update-manifests.mjs "${GITHUB_REF_NAME}" release

          mapfile -d '' artifacts < <(find release -type f \( -name '*.dmg' -o -name '*.zip' -o -name 'RELEASES-darwin-*.json' \) -print0)
          test "${#artifacts[@]}" -gt 0
          gh release create "${GITHUB_REF_NAME}" "${artifacts[@]}" \
            --verify-tag \
            --notes-file "$RUNNER_TEMP/release-notes.md"
